# 提交到 awesome-dsh-plugin 的条目模板
#
# 用法：
#   1. fork https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
#   2. 把它复制成 data/plugins/<owner>__<repo>.yml（owner、repo 都用你自己的，
#      文件名用双下划线连接，例如 charovo0059__dsh-model-vision.yml）
#   3. 改掉下面的 owner/repo/icon 三处占位，然后提 PR（一个 PR 最多 3 条）
#
# 合并前 CI 会依次检查：条目数量、仓库 package.json 里有没有 dsh.bundle、
# 仓库是否满 1 天、以及 awesome-lint。description 必须只陈述事实，不吹。
url: https://github.com/charovo0059/dsh-model-vision
name: charovo0059/dsh-model-vision
category: vision
description:
  en: Fills in the vision capability that DSH's "fetch models" step drops, so image-capable models stop being declared text-only, and marks them in the model name.
  zh: 补上 DSH「获取可用模型」漏记的视觉能力，让能看图的模型不再被当成纯文本，并在模型名后标出「可看图」。
icon: https://raw.githubusercontent.com/charovo0059/dsh-model-vision/main/assets/icon-180.png
